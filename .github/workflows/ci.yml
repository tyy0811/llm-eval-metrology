name: ci

# PLAN.md T0.3: tests, lint, dash-check, import-check on push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Canonical reproduction environment, see docs/DECISIONS.md D0.9. Pinned to a specific
    # runner image rather than ubuntu-latest, because byte identity of result files must not
    # move when GitHub rolls the latest label to a new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Exact patch version. "3.11" resolves to whatever patch the tool cache holds,
          # which is a moving target and therefore not a reproduction environment.
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements.txt

      # Exact pins, so a CI result and a local result mean the same thing.
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Provenance for every run. When result files exist, this is the record that says which
      # environment produced the canonical checksums.
      - name: Record environment
        run: |
          uname -srm
          grep PRETTY_NAME /etc/os-release
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
          python -m pip freeze
          python -m ruff --version
          python -m pytest --version

      - name: test
        run: make test

      - name: lint
        run: make lint

      - name: dash-check
        run: make dash-check

      - name: import-check
        run: make import-check

      - name: prose-check
        run: make prose-check

      - name: report-check
        run: make report-check

      # PLAN.md T0.2 requires this target to fail while it does not regenerate anything.
      # CI asserts the loud failure so the guarantee cannot rot unnoticed. Becomes a real
      # regeneration check at T3.5.
      - name: reproduce is a loud failure at this phase
        run: |
          if make reproduce; then
            echo "make reproduce succeeded but it does not regenerate anything yet"
            exit 1
          fi
          echo "make reproduce failed as required"
