name: ci

# PLAN.md T0.3: tests, lint, dash-check, import-check on push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Exact pins, so a CI result and a local result mean the same thing.
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Record environment
        run: |
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
          python -m ruff --version
          python -m pytest --version

      - name: test
        run: make test

      - name: lint
        run: make lint

      - name: dash-check
        run: make dash-check

      - name: import-check
        run: make import-check

      # PLAN.md T0.2 requires this target to fail while no experiment has produced results.
      # CI asserts the loud failure so the guarantee cannot rot unnoticed.
      - name: reproduce is a loud failure at this phase
        run: |
          if make reproduce; then
            echo "make reproduce succeeded but no experiment has produced results yet"
            exit 1
          fi
          echo "make reproduce failed as required"
