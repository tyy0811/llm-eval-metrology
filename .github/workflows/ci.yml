name: ci

# PLAN.md T0.3: tests, lint, dash-check, import-check on push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Canonical reproduction environment, see docs/DECISIONS.md D0.9. Pinned to a specific
    # runner image rather than ubuntu-latest, because byte identity of result files must not
    # move when GitHub rolls the latest label to a new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Exact patch version. "3.11" resolves to whatever patch the tool cache holds,
          # which is a moving target and therefore not a reproduction environment.
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements.txt

      # Exact pins, so a CI result and a local result mean the same thing.
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Provenance for every run. When result files exist, this is the record that says which
      # environment produced the canonical checksums.
      - name: Record environment
        run: |
          uname -srm
          grep PRETTY_NAME /etc/os-release
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
          python -m pip freeze
          python -m ruff --version
          python -m pytest --version

      - name: test
        run: make test

      - name: lint
        run: make lint

      - name: dash-check
        run: make dash-check

      - name: import-check
        run: make import-check

      - name: prose-check
        run: make prose-check

      - name: report-check
        run: make report-check

      # PLAN.md T3.5. This job is the only place a reproduction verdict is established:
      # the runner image and the interpreter patch version are both pinned above, which is
      # what "canonical" means under docs/DECISIONS.md D0.9. A local run is a development
      # check and says so.
      #
      # REPRODUCE_MODE=--canonical makes the checker fail on any interpreter but 3.11.15.
      # It is empty by default so development runs stay useful.
      - name: reproduce
        run: make reproduce PYTHON=python REPRODUCE_MODE=--canonical

      # Deliberately redundant with check_reproduction.py --verify. The script can be
      # wrong; git status in the job cannot be wrong in the same way, and the two failing
      # together is worth more than either alone. The checker gives artifact-specific
      # diagnostics, this gives a repository-wide backstop sharing no code with it.
      #
      # always() because GitHub would otherwise skip this step exactly when reproduce
      # fails, which is the only case whose diff anyone wants. HEAD rather than the
      # working tree, so a staged mismatch is not reported with an empty diff.
      - name: worktree is clean after reproduction
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff HEAD
            exit 1
          fi
